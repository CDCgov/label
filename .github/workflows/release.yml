name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - test

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RELEASE_BIN: label
  RELEASE_BASE: flu-amd
  REGISTRY: ghcr.io

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Extract Changelog
        id: extract_changelog
        shell: bash
        run: perl .github/scripts/last_release_notes.pl > "$RUNNER_TEMP/release_notes.md"

      - name: Create Source Code Archive
        id: create_archive
        shell: bash
        run: |
          ARCHIVE_NAME="$RUNNER_TEMP/${{ env.RELEASE_BIN }}-${{ github.ref_name }}-universal.zip"
          base="${{ env.RELEASE_BASE }}"

          cd .. && mv label "$base" \
          && zip -r "$ARCHIVE_NAME" . -x "$base/.git*" "$base/.vscode" "$base/.docker*" "$base/.*rc" "$base/Dockerfile" \
          && echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT" \
          && mv "$base" label

      - name: Create Release
        id: create_release
        shell: bash
        run: |
          latest=()
          [[ "${{ github.ref_name }}" == "test" ]] && latest=(--latest=false)

          gh release create "${{ github.ref_name }}" "${{ steps.create_archive.outputs.archive_name }}" \
            --draft \
            --title "${{ github.ref_name }}" \
            --notes-file "$RUNNER_TEMP/release_notes.md" \
            "${latest[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-release-images:
    name: Build and Push Release Image
    needs: create-release
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to dhi.io
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_REGISTRY_USER }}
          password: ${{ secrets.DHI_REGISTRY_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}-${{ matrix.arch }}

      - name: Build and push Docker image
        id: buildpush
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: mode=max
          sbom: generator=docker/scout-sbom-indexer:latest
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

  create-image-release-manifest:
    name: Create Release Manifest
    needs: build-release-images
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}

      - name: Create and push manifests
        id: manifest
        shell: bash
        env:
          DOCKER_METADATA_OUTPUT_ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          REPO=$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          VERSION="${REPO}:${{ github.ref_name }}"
          LATEST="${REPO}:latest"

          annotations=()
          while IFS= read -r annot; do
            [[ -n "$annot" ]] && annotations+=(--annotation "$annot")
          done <<< "$DOCKER_METADATA_OUTPUT_ANNOTATIONS"

          docker buildx imagetools create "${annotations[@]}" --tag "$VERSION" \
            "${VERSION}-amd64" "${VERSION}-arm64"

          # The version and latest tags share the same multi-platform digest.
          DIGEST="$(docker buildx imagetools inspect "$VERSION" --format '{{.Manifest.Digest}}')"
          {
            echo "signed_manifest=${REPO}@${DIGEST}"
            echo "repo=${REPO}"
            echo "digest=${DIGEST}"
          } >> "$GITHUB_OUTPUT"

          if [[ "${{ github.ref_name }}" != "test" ]]; then
            docker buildx imagetools create --tag "$LATEST" "$VERSION"
          fi

      - name: Sign image manifest
        shell: bash
        env:
          SIGNED_MANIFEST: ${{ steps.manifest.outputs.signed_manifest }}
        run: cosign sign --yes "$SIGNED_MANIFEST"

      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.manifest.outputs.repo }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - uses: actions/checkout@v6
        if: github.ref_name != 'test'

      - name: Publish Release
        if: github.ref_name != 'test'
        shell: bash
        run: gh release edit "${{ github.ref_name }}" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
